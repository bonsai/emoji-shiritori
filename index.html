<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Shiritori</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #f9f9f9;
      color: #333;
    }
    .emoji-shiritori {
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { margin-top: 0; }
    input[type="text"] {
      padding: 0.5rem;
      font-size: 1rem;
      width: 220px;
    }
    button {
      padding: 0.5rem 0.8rem;
      margin-left: 0.4rem;
      font-size: 1rem;
      cursor: pointer;
    }
    .candidates {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .candidates button {
      font-size: 1.6rem;
      padding: 0.3rem 0.5rem;
      background: #eef;
      border: 1px solid #ccf;
      border-radius: 6px;
    }
    .history {
      padding-left: 1.2rem;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { main } from "./build/dev/javascript/emoji_shiritori/emoji_shiritori.mjs";
    main();
  </script>
</body>
</html>
